<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrolibros</title>
  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">ASTROLIBROS</a>
    <nav class="header-nav">
      <a href="carrito.html" class="nav-btn">
        <img src="img/cart-icon0.svg" alt="Carrito" class="nav-icon">
        <span>Carro</span>
      </a>
      <a href="login.html" class="nav-btn">
        <img src="img/cart-icon-container0.svg" alt="Usuario" class="nav-icon">
        <span>Iniciar sesión</span>
      </a>
    </nav>

    <style>
      body { overflow: hidden; }
    </style>

  </header>

  <!-- CUERPO: 4 PANELES -->
  <main class="paneles">

    <a href="libros.html" class="panel">
      <img src="img/Libros.jpg" alt="Libros" class="panel-img">
      <div class="panel-overlay" style="--color-panel: #f50000;"></div>
      <span class="panel-label">Libros</span>
    </a>

    <a href="talleres.html" class="panel">
      <img src="img/taller.jpg" alt="Talleres" class="panel-img vista-derecha zoom-inicial">
      <div class="panel-overlay" style="--color-panel: #f56f00;"></div>
      <span class="panel-label">Talleres</span>
    </a>

    <a href="eventos.html" class="panel">
      <img src="img/Eventos.jpg" alt="Eventos" class="panel-img vista-derecha">
      <div class="panel-overlay" style="--color-panel: #00c400;"></div>
      <span class="panel-label">Eventos</span>
    </a>

    <a href="nosotros.html" class="panel">
      <img src="img/nosotros.jpg" alt="Nosotros" class="panel-img vista-derecha">
      <div class="panel-overlay" style="--color-panel: #009393;"></div>
      <span class="panel-label">Nosotros</span>
    </a>

  </main>

</body>
</html>
